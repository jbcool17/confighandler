name: bump-version

on:
  workflow_dispatch:
    inputs:
      version_type:
        description: 'Version bump type'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major
      trigger_release:
        description: 'Trigger GoReleaser after bump'
        required: false
        default: true
        type: boolean

permissions:
  contents: write
  actions: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Bump version
        run: ./scripts/bump-version.sh ${{ inputs.version_type }}

      - name: Verify tag
        run: |
          git describe --tags --abbrev=0

      - name: Trigger GoReleaser
        if: ${{ inputs.trigger_release }}
        run: |
          gh workflow run goreleaser.yaml
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
